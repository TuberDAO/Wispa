<svg width="1200" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Define MORE VISIBLE tech component shapes -->
    <g id="chip">
      <rect x="0" y="0" width="40" height="40" fill="none" stroke="rgba(0, 255, 136, 0.25)" stroke-width="1"/>
      <rect x="5" y="5" width="30" height="30" fill="rgba(0, 255, 136, 0.08)" stroke="rgba(0, 255, 136, 0.2)" stroke-width="1"/>
      <line x1="0" y1="10" x2="5" y2="10" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1"/>
      <line x1="0" y1="20" x2="5" y2="20" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1"/>
      <line x1="0" y1="30" x2="5" y2="30" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1"/>
      <line x1="35" y1="10" x2="40" y2="10" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1"/>
      <line x1="35" y1="20" x2="40" y2="20" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1"/>
      <line x1="35" y1="30" x2="40" y2="30" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1"/>
    </g>
    
    <g id="circuit">
      <path d="M0,20 L20,20 L20,0" fill="none" stroke="rgba(0, 217, 255, 0.25)" stroke-width="1"/>
      <circle cx="20" cy="20" r="2" fill="rgba(0, 217, 255, 0.3)"/>
    </g>
    
    <g id="component">
      <rect x="0" y="0" width="30" height="20" rx="2" fill="rgba(0, 255, 136, 0.06)" stroke="rgba(0, 255, 136, 0.25)" stroke-width="1"/>
      <circle cx="8" cy="10" r="1.5" fill="rgba(0, 255, 136, 0.3)"/>
      <circle cx="22" cy="10" r="1.5" fill="rgba(0, 255, 136, 0.3)"/>
    </g>
    
    <g id="connector">
      <rect x="0" y="0" width="15" height="25" fill="rgba(0, 217, 255, 0.05)" stroke="rgba(0, 217, 255, 0.25)" stroke-width="1"/>
      <line x1="3" y1="5" x2="12" y2="5" stroke="rgba(0, 217, 255, 0.2)" stroke-width="0.8"/>
      <line x1="3" y1="10" x2="12" y2="10" stroke="rgba(0, 217, 255, 0.2)" stroke-width="0.8"/>
      <line x1="3" y1="15" x2="12" y2="15" stroke="rgba(0, 217, 255, 0.2)" stroke-width="0.8"/>
      <line x1="3" y1="20" x2="12" y2="20" stroke="rgba(0, 217, 255, 0.2)" stroke-width="0.8"/>
    </g>
  </defs>
  
  <!-- Arrange components in a scattered, technical pattern -->
  <!-- Top left area -->
  <use href="#chip" x="100" y="80" transform="rotate(-15 120 100)"/>
  <use href="#circuit" x="200" y="120"/>
  <use href="#component" x="180" y="200" transform="rotate(8 195 210)"/>
  
  <!-- Top right area -->
  <use href="#connector" x="900" y="100" transform="rotate(12 907 112)"/>
  <use href="#chip" x="1000" y="150" transform="rotate(-8 1020 170)"/>
  <use href="#circuit" x="950" y="220"/>
  
  <!-- Center scattered -->
  <use href="#component" x="300" y="400" transform="rotate(-5 315 410)"/>
  <use href="#chip" x="450" y="350" transform="rotate(18 470 370)"/>
  <use href="#connector" x="600" y="400" transform="rotate(-12 607 412)"/>
  <use href="#circuit" x="750" y="450"/>
  <use href="#component" x="850" y="420" transform="rotate(10 865 430)"/>
  
  <!-- Middle left -->
  <use href="#chip" x="120" y="500" transform="rotate(-20 140 520)"/>
  <use href="#connector" x="250" y="550" transform="rotate(15 257 562)"/>
  <use href="#circuit" x="180" y="620"/>
  
  <!-- Middle right -->
  <use href="#component" x="950" y="550" transform="rotate(-8 965 560)"/>
  <use href="#chip" x="1050" y="600" transform="rotate(12 1070 620)"/>
  
  <!-- Bottom area -->
  <use href="#circuit" x="300" y="850"/>
  <use href="#connector" x="400" y="900" transform="rotate(-10 407 912)"/>
  <use href="#chip" x="550" y="880" transform="rotate(15 570 900)"/>
  <use href="#component" x="700" y="920" transform="rotate(-5 715 930)"/>
  <use href="#circuit" x="850" y="900"/>
  <use href="#connector" x="950" y="950" transform="rotate(8 957 962)"/>
  
  <!-- Additional scattered elements for depth -->
  <use href="#circuit" x="400" y="250"/>
  <use href="#component" x="650" y="200" transform="rotate(-12 665 210)"/>
  <use href="#chip" x="500" y="650" transform="rotate(20 520 670)"/>
  <use href="#connector" x="350" y="700" transform="rotate(-15 357 712)"/>
  <use href="#circuit" x="800" y="750"/>
  <use href="#component" x="200" y="350" transform="rotate(10 215 360)"/>
  
  <!-- Faint connecting lines between some components -->
  <line x1="220" y1="140" x2="300" y2="410" stroke="rgba(0, 255, 136, 0.02)" stroke-width="0.3" stroke-dasharray="2,3"/>
  <line x1="470" y1="370" x2="620" y2="420" stroke="rgba(0, 217, 255, 0.02)" stroke-width="0.3" stroke-dasharray="2,3"/>
  <line x1="750" y1="470" x2="850" y2="900" stroke="rgba(0, 255, 136, 0.02)" stroke-width="0.3" stroke-dasharray="2,3"/>
  <line x1="1020" y1="170" x2="1070" y2="620" stroke="rgba(0, 217, 255, 0.02)" stroke-width="0.3" stroke-dasharray="2,3"/>
</svg>

